name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".gitbook.yaml"
      - "scripts/check-links.mjs"
      - ".github/workflows/documentation.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".gitbook.yaml"
      - "scripts/check-links.mjs"

permissions:
  contents: read

jobs:
  links:
    name: Local documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-links.mjs
